<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; color: #fff; font-family: system-ui, 'Segoe UI', sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8vw; box-sizing: border-box; }
  h1 { font-size: 9vw; margin: 0 0 3vw 0; line-height: 1.15; }
  p { font-size: 4.5vw; margin: 0; opacity: .85; }
  .bar { width: 40vw; height: 1.2vw; background: rgba(255,255,255,.15); margin-top: 6vw; border-radius: 1vw; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #4ade80; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Tu producto, sin friccion</h1>
    <p id="sub">Rapido. Simple. Para todo el equipo.</p>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <script>
    // Contrato VideoCraft: pinta el estado exacto del segundo t.
    // Determinista: la misma t produce siempre el mismo fotograma.
    var DURATION = 2.0; // debe coincidir con duration del item scene
    window.vcSeek = function (t) {
      var p = Math.min(Math.max(t / DURATION, 0), 1);
      var appear = Math.min(1, p * 3);
      document.getElementById('title').style.opacity = appear;
      document.getElementById('title').style.transform = 'translateY(' + (1 - appear) * 40 + 'px)';
      document.getElementById('sub').style.opacity = Math.min(1, Math.max(0, (p - 0.3) * 3));
      document.getElementById('bar').style.width = (p * 100) + '%';
    };
  </script>
</body>
</html>
