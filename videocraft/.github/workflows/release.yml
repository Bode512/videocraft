name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Render integration tests
        shell: pwsh
        run: ./tests/smoke.ps1
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/videocraft.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  videocraft.exe" | Set-Content target/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: videocraft-windows-x64
          path: |
            target/release/videocraft.exe
            target/release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} target/release/videocraft.exe target/release/SHA256SUMS.txt --generate-notes


