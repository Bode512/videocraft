[package]
name = "videocraft"
version = "1.0.0"
edition = "2021"
description = "Agent-first video editing CLI: media assembly and HTML scene rendering via FFmpeg"
license = "MIT"
repository = "https://github.com/Bode512/videocraft"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
strip = true
lto = true
