<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04160a; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  .code { position: absolute; inset: 0; font-family: Consolas, monospace; font-size: 3.6vw; color: #14532d; line-height: 2.1; padding: 4vw; box-sizing: border-box; user-select: none; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 7vw; box-sizing: border-box; gap: 5vw; }
  .braces { font-size: 34vw; font-weight: 900; font-family: Consolas, monospace; color: #22c55e; line-height: .9; filter: drop-shadow(0 0 6vw rgba(34,197,94,.55)); }
  .line { font-size: 9.5vw; font-weight: 900; line-height: 1.15; letter-spacing: -0.01em; }
  .line .g { color: #4ade80; }
  .cmd { font-family: Consolas, monospace; font-size: 4.8vw; font-weight: 700; color: #bbf7d0; background: rgba(0,0,0,.55); border: 1px solid rgba(74,222,128,.5); border-radius: 2.5vw; padding: 2.6vw 5vw; box-shadow: 0 0 5vw rgba(34,197,94,.25); }
  .cmd .dollar { color: #4ade80; }
</style>
</head>
<body>
  <div class="code" id="code">{
  "engine": "html+ffmpeg",
  "fps": 30, "crf": 18,
  "ducking": "sidechain",
  "loudnorm": "I=-16",
  "items": ["scene", "clip",
            "image", "voice"],
  "quality": "verified"
}</div>
  <div class="wrap">
    <div class="braces" id="braces">{ }</div>
    <div class="line" id="l1">One <span class="g">JSON.</span></div>
    <div class="line" id="l2">One <span class="g">command.</span></div>
    <div class="cmd" id="cmd"><span class="dollar">&gt;</span> videocraft render ad.mp4</div>
  </div>
<script>
  var D = 3.0;
  function ease(p) { return 1 - Math.pow(1 - Math.min(Math.max(p, 0), 1), 3); }
  window.vcSeek = function (t) {
    var p = Math.min(Math.max(t / D, 0), 1);
    var pulse = Math.exp(-6 * (t % 0.5));
    var br = document.getElementById('braces');
    var b = ease(p * 2.4);
    br.style.opacity = 0.9;
    br.style.transform = 'scale(' + (1.3 - b * 0.3) + ')';
    br.style.letterSpacing = (0.2 - b * 0.2) + 'em';
    var l1 = ease(Math.max(0, (p - 0.2) * 3));
    document.getElementById('l1').style.opacity = l1;
    document.getElementById('l1').style.transform = 'translateX(' + (1 - l1) * -80 + 'px)';
    var l2 = ease(Math.max(0, (p - 0.35) * 3));
    document.getElementById('l2').style.opacity = l2;
    document.getElementById('l2').style.transform = 'translateX(' + (1 - l2) * 80 + 'px)';
    var cmd = ease(Math.max(0, (p - 0.5) * 2.6));
    document.getElementById('cmd').style.opacity = cmd;
    document.getElementById('cmd').style.transform = 'scale(' + (0.9 + cmd * 0.1 + 0.015 * pulse) + ')';
    document.getElementById('code').style.opacity = 0.35 + 0.25 * Math.sin(t * 1.1);
  };
</script>
</body>
</html>
